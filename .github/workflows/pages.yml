# ينشر web/dist إلى GitHub Pages.
#
# البناء في CI لا محلّياً، وdist خارج git: مخرَجٌ مُودَع يفترق عن مصدره أوّل
# مرّة يُنسى فيها البناء قبل الدفع، فتُخدَم صفحة لا تطابق الشيفرة التي تراها.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # البوابات نفسها التي تعمل محلّياً. البناء الذي يمرّ بلا فحص ساكن
      # ينشر أخطاء الأنواع بدل أن يمسكها.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
