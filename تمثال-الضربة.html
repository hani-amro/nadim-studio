<three-d-stage name="al-darbeh" background="#171009" autorotate></three-d-stage>

    <p class="meta">برونز على رخام · ٢١٥ × ٦٥ × ٦٥ سم · ٢٠٢٦</p>
    <p class="quote">« أول ضربة فرشاة بتكون دايماً بالهوا قبل ما تلمس القماش. حاولت جمّدها بالبرونز. »</p>

<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const bronze = new THREE.MeshStandardMaterial({ name: 'bronze', color: 0xb98d4d, roughness: 0.36, metalness: 0.38 });
const oxide  = new THREE.MeshStandardMaterial({ name: 'oxide',  color: 0xa8492f, roughness: 0.62, metalness: 0.12 });
const marble = new THREE.MeshStandardMaterial({ name: 'marble', color: 0xe7e1d3, roughness: 0.55, metalness: 0.04 });
const brass  = new THREE.MeshStandardMaterial({ name: 'brass',  color: 0xd9a441, roughness: 0.28, metalness: 0.4 });

// TubeGeometry, retapered ring-by-ring so the stroke thickens at the heel
// and whips thin at the tip, and flattened across its sweep into a ribbon.
function strokeGeometry(curve, segs, radius, radial, taper, flat) {
  const geo = new THREE.TubeGeometry(curve, segs, radius, radial, false);
  const pos = geo.attributes.position;
  for (let i = 0; i <= segs; i++) {
    const c = curve.getPointAt(i / segs);
    const k = taper(i / segs);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      const ox = (pos.getX(idx) - c.x) * k;
      const oy = (pos.getY(idx) - c.y) * k;
      const oz = (pos.getZ(idx) - c.z) * k * flat;
      pos.setXYZ(idx, c.x + ox, c.y + oy, c.z + oz);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}
const taper = (t) => t < 0.18 ? 0.55 + (t / 0.18) * 0.45 : 1 - 0.9 * Math.pow((t - 0.18) / 0.82, 1.7);
const pts = (a) => new THREE.CatmullRomCurve3(a.map(p => new THREE.Vector3(p[0], p[1], p[2])));

const model = new THREE.Group();
model.name = 'al_darbeh';

const foot = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.62), marble);
foot.name = 'plinth_foot'; foot.position.y = 0.025;

const body = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.72, 0.50), marble);
body.name = 'plinth_body'; body.position.y = 0.40;

const cap = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.055, 0.64), marble);
cap.name = 'plinth_cap'; cap.position.y = 0.7775;

const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.09, 0.015), brass);
plaque.name = 'plaque'; plaque.position.set(0, 0.52, 0.258);

const top = 0.806;
const stroke = new THREE.Group();
stroke.name = 'stroke_group';
stroke.position.y = top;

const mainCurve = pts([[-0.30, 0.00, 0.06], [-0.02, 0.26, -0.06], [0.26, 0.50, 0.06], [0.02, 0.82, -0.05], [-0.26, 1.06, 0.05], [0.10, 1.34, 0.00]]);
const main = new THREE.Mesh(strokeGeometry(mainCurve, 200, 0.10, 30, taper, 0.42), bronze);
main.name = 'stroke_main';

const accentCurve = pts([[0.26, 0.04, -0.12], [0.06, 0.36, 0.12], [-0.20, 0.62, -0.08], [0.06, 0.92, 0.10], [-0.05, 1.12, 0.00]]);
const accent = new THREE.Mesh(strokeGeometry(accentCurve, 150, 0.048, 26, taper, 0.5), oxide);
accent.name = 'stroke_accent';

const heel = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.032, 40), bronze);
heel.name = 'stroke_heel'; heel.position.set(-0.28, 0.016, 0.05);

const drops = [[0.22, 0.030, 0.15, 0.030], [-0.24, 0.022, -0.11, 0.022], [0.26, 0.017, -0.18, 0.017]];
drops.forEach((d, i) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(d[3], 24, 18), i === 1 ? oxide : bronze);
  m.name = 'drop_' + (i + 1);
  m.position.set(d[0], d[1] + 0.001, d[2]);
  stroke.add(m);
});

stroke.add(main, accent, heel);
model.add(foot, body, cap, plaque, stroke);
stage.setObject(model);
</script>
